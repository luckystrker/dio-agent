services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dio}
      POSTGRES_DB: ${POSTGRES_DB:-dio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dio} -d ${POSTGRES_DB:-dio}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dio-pgdata:
